name: Build and Unit Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Quick Install
        run: mvn clean install -DskipTests -Dlicense.skip=true -Dskip.npm=true -Dskip.docker=true -pl '!msa/js-executor,!msa/web-ui,!ui-ngx' -am -T 1C
        env:
          MAVEN_OPTS: -Xmx2048m

      - name: Run Unit Tests
        run: mvn test -Dlicense.skip=true -pl '!msa/js-executor,!msa/web-ui,!ui-ngx' -T 1C
        env:
          MAVEN_OPTS: -Xmx2048m

      - name: Launch and Smoke Test
        run: |
          java -Xmx1024m -jar application/target/thingsboard.jar --server.port=8080 &
          timeout 120s bash -c 'until curl -s localhost:8080/login; do sleep 5; done'

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/target/surefire-reports/*.xml"
