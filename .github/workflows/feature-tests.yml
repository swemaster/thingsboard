name: Feature Tests (TemperatureUtil)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  feature-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build common/util module
        run: mvn clean install -DskipTests -Dlicense.skip=true -pl common/util -am
        env:
          MAVEN_OPTS: -Xmx1024m

      - name: Run TemperatureUtil Tests
        run: mvn test -pl common/util -Dtest=TemperatureUtilTest -Dlicense.skip=true
        env:
          MAVEN_OPTS: -Xmx1024m

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-test-results
          path: "**/target/surefire-reports/*.xml"
