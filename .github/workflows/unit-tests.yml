name: Build and Unit Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build project (skip tests)
        run: |
          mvn clean install -DskipTests -Dlicense.skip=true -T2
        env:
          MAVEN_OPTS: -Xmx1024m
          NODE_OPTIONS: --max_old_space_size=4096

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build dependencies
        run: |
          mvn clean install -DskipTests -Dlicense.skip=true -T2
        env:
          MAVEN_OPTS: -Xmx1024m
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Run unit tests (fast modules)
        run: |
          mvn test -pl='!application,!dao,!ui-ngx,!msa/js-executor,!msa/web-ui' -T4 -Dlicense.skip=true
        env:
          MAVEN_OPTS: -Xmx1024m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7
